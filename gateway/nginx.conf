server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/recolix.crt;
    ssl_certificate_key /etc/nginx/certs/recolix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 302 /recolix/LandingPage/index_LandingPage.html;
    }

    location /recolix/LandingPage/     { proxy_pass http://landing; }
    location /recolix/Backoffice/      { proxy_pass http://backoffice; }
    location /recolix/API_Usuarios/    { proxy_pass http://api-usuarios; }
    location /recolix/API_Gestion/     { proxy_pass http://api-gestion; }
    location /recolix/API_Recoleccion/ { proxy_pass http://api-recoleccion; }
    location /recolix/extra/           { proxy_pass http://landing; }
}
