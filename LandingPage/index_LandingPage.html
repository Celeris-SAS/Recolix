  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_USUARIOS = '/Recolix/API_Usuarios';
    const API_GESTION = '/Recolix/API_Gestion';
    const I18N = <?= json_encode(t_array([
      'ci' => 'landing.validation_ci',
      'nombre' => 'landing.validation_nombre',
      'apellido' => 'landing.validation_apellido',
      'email' => 'landing.validation_email',
      'telefono' => 'landing.validation_telefono',
      'contrasenia' => 'landing.validation_contrasenia',
      'revisarCampos' => 'landing.feedback_revisar_campos',
      'solicitudEnviada' => 'landing.feedback_solicitud_enviada',
      'errorConexion' => 'landing.feedback_error_conexion',
      'errorEnviar' => 'landing.feedback_error_enviar',
    ])) ?>;

    document.addEventListener('DOMContentLoaded', function () {

      (async function () {
        if (!window.L) return;

        const heroMap = L.map('hero-mapa', {
          zoomControl: true,
          scrollWheelZoom: false,
          attributionControl: false
        }).setView([-34.901, -56.165], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(heroMap);

        const COLORES = {
          funcional: '#4CAF50',
          inactivo: '#e3b23c',
          desbordado: '#c0392b',
          roto: '#2b2b2b',
          en_deposito: '#4a5568'
        };

        const addPoint = (lat, lon, estado) => {
          if (!estado || !COLORES[estado]) estado = 'funcional';
          L.circleMarker([lat, lon], {
            radius: 4, color: '#fff', opacity: 0.6,
            weight: 1.5, fillColor: COLORES[estado], fillOpacity: 0.85
          }).addTo(heroMap);
        };

        try {
          const resp = await fetch(`${API_GESTION}/contenedores`, {
            signal: AbortSignal.timeout(5000)
          });
          const json = await resp.json();
          const puntos = Array.isArray(json) ? json : json && json.data;

          if (Array.isArray(puntos)) {
            for (const p of puntos) {
              const lat = parseFloat(p.latitud);
              const lon = parseFloat(p.longitud);
              if (Number.isNaN(lat) || Number.isNaN(lon)) continue;
              addPoint(lat, lon, p.estado);
            }
          }
        } catch (_) { }

        setTimeout(() => heroMap.invalidateSize(), 250);
      })();


      const header = document.getElementById('siteHeader');
      window.addEventListener('scroll', () => {
        header.classList.toggle('is-scrolled', window.scrollY > 40);
      });


      const btn = document.getElementById('hamburgerBtn');
      const nav = document.getElementById('mainNav');
      btn.addEventListener('click', () => {
        const abierto = nav.classList.toggle('is-open');
        btn.classList.toggle('is-open', abierto);
        btn.textContent = abierto ? '✕' : '☰';
      });


      setTimeout(() => {
        document.getElementById('statContenedores').textContent = '13.420';
        document.getElementById('statIncidencias').textContent = '27';
        document.getElementById('statVolumen').textContent = '184 t';
      }, 500);


      const form = document.getElementById('registerForm');
      const reglas = {
        ci: [/^\d{7,8}$/, I18N.ci],
        nombre: [/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]{2,50}$/, I18N.nombre],
        apellido: [/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]{2,50}$/, I18N.apellido],
        email: [/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, I18N.email],
        telefono: [/^\d{9}$/, I18N.telefono],
        contrasenia: [/^.{8,}$/, I18N.contrasenia]
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        let esValido = true;

        for (const campo in reglas) {
          const input = form.elements[campo];
          const error = document.getElementById(campo + 'Error');
          const [regex, mensaje] = reglas[campo];
          const ok = regex.test(input.value.trim());
          error.textContent = ok ? '' : mensaje;
          if (!ok) esValido = false;
        }

        const feedback = document.getElementById('formFeedback');
        feedback.style.display = 'block';

        if (!esValido) {
          feedback.className = 'form-feedback is-error';
          feedback.textContent = I18N.revisarCampos;
          return;
        }

        try {
          const resp = await fetch(`${API_USUARIOS}/solicitudes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ci: form.elements.ci.value.trim(),
              primerNombre: form.elements.nombre.value.trim(),
              pApellido: form.elements.apellido.value.trim(),
              email: form.elements.email.value.trim(),
              tel: form.elements.telefono.value.trim(),
              contrasenia: form.elements.contrasenia.value
            })
          });
          const json = await resp.json();

          if (json.status !== 'success') {
            feedback.className = 'form-feedback is-error';
            feedback.textContent = json.message || I18N.errorEnviar;
            return;
          }

          feedback.className = 'form-feedback is-success';
          feedback.textContent = I18N.solicitudEnviada;
          form.reset();

        } catch (e) {
          feedback.className = 'form-feedback is-error';
          feedback.textContent = I18N.errorConexion;
        }
      });
    });
  </script>
