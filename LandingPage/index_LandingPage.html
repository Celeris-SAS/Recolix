  <script>
    const API_USUARIOS = '/recolix/API_Usuarios/';
    const API_GESTION = '/recolix/API_Gestion/';
    const I18N = <?= json_encode(t_array([
      'ci' => 'landing.validation_ci',
      'nombre' => 'landing.validation_nombre',
      'apellido' => 'landing.validation_apellido',
      'email' => 'landing.validation_email',
      'telefono' => 'landing.validation_telefono',
      'contrasenia' => 'landing.validation_contrasenia',
      'revisarCampos' => 'landing.feedback_revisar_campos',
      'solicitudEnviada' => 'landing.feedback_solicitud_enviada',
      'errorConexion' => 'landing.feedback_error_conexion',
      'errorEnviar' => 'landing.feedback_error_enviar',
      'reportarValidationContenedor' => 'landing.reportar_validation_contenedor',
      'reportarEnviado' => 'landing.reportar_feedback_enviado',
      'reportarErrorEnviar' => 'landing.reportar_feedback_error_enviar',
      'reportarErrorConexion' => 'landing.reportar_feedback_error_conexion',
      'detectandoUbicacion' => 'landing.reportar_detectando_ubicacion',
      'ubicacionDetectada' => 'landing.reportar_ubicacion_detectada',
      'ubicacionDenegada' => 'landing.reportar_ubicacion_denegada',
      'ubicacionNoDisponible' => 'landing.reportar_ubicacion_no_disponible',
      'contenedorSeleccionado' => 'landing.reportar_contenedor_seleccionado',
      'tuUbicacion' => 'landing.reportar_tu_ubicacion',
      'reportarFotoTipoInvalido' => 'landing.reportar_foto_tipo_invalido',
      'reportarFotoTamanoInvalido' => 'landing.reportar_foto_tamano_invalido',
    ])) ?>;

    document.addEventListener('DOMContentLoaded', function () {

      (async function () {
        if (!window.L) return;

        const heroMap = L.map('hero-mapa', {
          zoomControl: true,
          scrollWheelZoom: false,
          attributionControl: false
        }).setView([-34.901, -56.165], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(heroMap);

        // Misma fuente de contenedores y colores que el mapa público y los mapas de reportar incidencia.
        await cargarContenedoresEnMapa(heroMap, { apiBase: API_GESTION, radius: 4 });

        setTimeout(() => heroMap.invalidateSize(), 250);
      })();


      const header = document.getElementById('siteHeader');
      window.addEventListener('scroll', () => {
        header.classList.toggle('is-scrolled', window.scrollY > 40);
      });


      const btn = document.getElementById('hamburgerBtn');
      const nav = document.getElementById('mainNav');
      btn.addEventListener('click', () => {
        const abierto = nav.classList.toggle('is-open');
        btn.classList.toggle('is-open', abierto);
        btn.textContent = abierto ? '✕' : '☰';
      });


      setTimeout(() => {
        document.getElementById('statContenedores').textContent = '13.420';
        document.getElementById('statIncidencias').textContent = '27';
        document.getElementById('statVolumen').textContent = '184 t';
      }, 500);


      const form = document.getElementById('registerForm');
      const reglas = {
        ci: [/^\d{7,8}$/, I18N.ci],
        nombre: [/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]{2,50}$/, I18N.nombre],
        apellido: [/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]{2,50}$/, I18N.apellido],
        email: [/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, I18N.email],
        telefono: [/^\d{9}$/, I18N.telefono],
        contrasenia: [/^.{8,}$/, I18N.contrasenia]
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        let esValido = true;

        for (const campo in reglas) {
          const input = form.elements[campo];
          const error = document.getElementById(campo + 'Error');
          const [regex, mensaje] = reglas[campo];
          const ok = regex.test(input.value.trim());
          error.textContent = ok ? '' : mensaje;
          if (!ok) esValido = false;
        }

        const feedback = document.getElementById('formFeedback');
        feedback.style.display = 'block';

        if (!esValido) {
          feedback.className = 'form-feedback is-error';
          feedback.textContent = I18N.revisarCampos;
          return;
        }

        try {
          const resp = await fetch(`${API_USUARIOS}/solicitudes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ci: form.elements.ci.value.trim(),
              primerNombre: form.elements.nombre.value.trim(),
              pApellido: form.elements.apellido.value.trim(),
              email: form.elements.email.value.trim(),
              tel: form.elements.telefono.value.trim(),
              contrasenia: form.elements.contrasenia.value
            })
          });
          const json = await resp.json();

          if (json.status !== 'success') {
            feedback.className = 'form-feedback is-error';
            feedback.textContent = json.message || I18N.errorEnviar;
            return;
          }

          feedback.className = 'form-feedback is-success';
          feedback.textContent = I18N.solicitudEnviada;
          form.reset();

        } catch (e) {
          feedback.className = 'form-feedback is-error';
          feedback.textContent = I18N.errorConexion;
        }
      });


      // RF03: reportar incidencia (usuario autenticado) desde la Landing Page
      const reportarForm = document.getElementById('reportarForm');
      const btnReportar = document.getElementById('btnReportarIncidencia');

      btnReportar.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const resp = await fetch(`${API_USUARIOS}/sesion.php`);
          const data = await resp.json();
          if (!data.loggedIn) {
            window.location.href = 'login.html';
            return;
          }
          abrirModalReportar();
        } catch (e) {
          window.location.href = 'login.html';
        }
      });

      // RF05/RF06: mapa interactivo — muestra la ubicación del usuario y permite elegir el
      // contenedor de la incidencia tocándolo directamente en el mapa. Los contenedores y sus
      // colores salen de cargarContenedoresEnMapa() (mapaContenedoresBase.js), la misma fuente
      // que usan el mini-mapa del hero y el mapa público.
      let repMapa = null;
      let repMapaMarcadores = null;
      let repMarcadorUsuario = null;
      let repMarcadorSeleccionado = null;

      function distanciaKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function seleccionarContenedorEnMapa(marker, c) {
        document.getElementById('repContenedor').value = c.id_contenedor;
        document.getElementById('repContenedorError').textContent = '';
        const seleccionado = document.getElementById('repContenedorSeleccionado');
        seleccionado.style.display = '';
        seleccionado.textContent = `${I18N.contenedorSeleccionado}: #${c.id_contenedor} — ${c.calle} ${c.num_calle}`;

        if (repMarcadorSeleccionado) repMarcadorSeleccionado.setStyle({ weight: 1.5, radius: 7 });
        marker.setStyle({ weight: 3, radius: 10 });
        repMarcadorSeleccionado = marker;
      }

      // Si el usuario no toca ningún contenedor en el mapa, se preselecciona el más cercano
      // a su ubicación detectada — nunca queda sin elegir uno.
      function preseleccionarMasCercano(latitude, longitude) {
        if (!repMapaMarcadores || !repMapaMarcadores.length) return;
        let masCercano = null;
        let distanciaMin = Infinity;
        repMapaMarcadores.forEach((m) => {
          const c = m.contenedor;
          const d = distanciaKm(latitude, longitude, parseFloat(c.latitud), parseFloat(c.longitud));
          if (d < distanciaMin) {
            distanciaMin = d;
            masCercano = m;
          }
        });
        if (masCercano) seleccionarContenedorEnMapa(masCercano, masCercano.contenedor);
      }

      // RF07: adjunto de foto (JPG/PNG, máx 5 MB) — se valida en el cliente y se manda como
      // data URL base64 dentro del mismo JSON del reporte, ya que el endpoint solo acepta JSON.
      const MAX_FOTO_BYTES = 5 * 1024 * 1024;
      function leerFotoComoBase64(input, errorEl) {
        errorEl.textContent = '';
        const file = input.files && input.files[0];
        if (!file) return Promise.resolve(null);
        if (!['image/jpeg', 'image/png'].includes(file.type)) {
          errorEl.textContent = I18N.reportarFotoTipoInvalido;
          return Promise.reject(new Error('tipo'));
        }
        if (file.size > MAX_FOTO_BYTES) {
          errorEl.textContent = I18N.reportarFotoTamanoInvalido;
          return Promise.reject(new Error('tamano'));
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function iniciarMapaReportar() {
        const status = document.getElementById('repUbicacionStatus');
        status.style.display = '';
        status.textContent = I18N.detectandoUbicacion;
        document.getElementById('repContenedorSeleccionado').style.display = 'none';
        repMarcadorSeleccionado = null;

        if (!repMapa) {
          repMapa = L.map('repMapaContenedor', { zoomControl: true }).setView([-34.901, -56.165], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(repMapa);

          repMapaMarcadores = await cargarContenedoresEnMapa(repMapa, {
            apiBase: API_GESTION,
            radius: 7,
            tooltip: (c) => `#${c.id_contenedor} — ${c.calle} ${c.num_calle}`,
            onClick: seleccionarContenedorEnMapa
          });
        }
        setTimeout(() => repMapa.invalidateSize(), 200);

        if (!navigator.geolocation) {
          status.textContent = I18N.ubicacionNoDisponible;
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            status.textContent = I18N.ubicacionDetectada;
            if (repMarcadorUsuario) repMapa.removeLayer(repMarcadorUsuario);
            const icono = L.divIcon({
              className: 'mapa-marcador-usuario-wrap',
              html: '<span class="mapa-marcador-usuario"></span>',
              iconSize: [22, 22],
              iconAnchor: [11, 22]
            });
            repMarcadorUsuario = L.marker([latitude, longitude], { icon: icono })
              .addTo(repMapa)
              .bindTooltip(I18N.tuUbicacion);
            repMapa.setView([latitude, longitude], 15);
            preseleccionarMasCercano(latitude, longitude);
          },
          () => {
            status.textContent = I18N.ubicacionDenegada;
          },
          { timeout: 8000 }
        );
      }

      window.abrirModalReportar = function () {
        reportarForm.reset();
        document.getElementById('reportarFeedback').style.display = 'none';
        document.getElementById('repContenedorError').textContent = '';
        document.getElementById('repFotoError').textContent = '';
        document.getElementById('modalReportar').style.display = 'flex';
        iniciarMapaReportar();
      };

      window.cerrarModalReportar = function () {
        document.getElementById('modalReportar').style.display = 'none';
      };

      window.onOverlayClickReportar = function (e) {
        if (e.target.id === 'modalReportar') cerrarModalReportar();
      };

      reportarForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const feedback = document.getElementById('reportarFeedback');
        const contenedorError = document.getElementById('repContenedorError');
        contenedorError.textContent = '';
        feedback.style.display = 'none';

        const idContenedor = parseInt(document.getElementById('repContenedor').value, 10);
        const tipo = document.getElementById('repTipo').value;
        const descripcion = document.getElementById('repDescripcion').value.trim();

        if (!idContenedor || idContenedor < 1) {
          contenedorError.textContent = I18N.reportarValidationContenedor;
          return;
        }

        let imagen;
        try {
          imagen = await leerFotoComoBase64(document.getElementById('repFoto'), document.getElementById('repFotoError'));
        } catch {
          return;
        }

        try {
          // Orden posicional: coincide con crearIncidencia($idContenedor, $tipo, $descripcion, $imagen).
          // La identidad del usuario la resuelve el servidor a partir de la sesión, no se manda acá.
          const resp = await fetch(`${API_GESTION}/incidencias`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idContenedor, tipo, descripcion: descripcion || null, imagen })
          });
          const json = await resp.json();

          if (json.status !== 'success') {
            feedback.className = 'form-feedback is-error';
            feedback.style.display = 'block';
            feedback.textContent = json.message || I18N.reportarErrorEnviar;
            return;
          }

          feedback.className = 'form-feedback is-success';
          feedback.style.display = 'block';
          feedback.textContent = I18N.reportarEnviado;
          reportarForm.reset();
          setTimeout(cerrarModalReportar, 1800);

        } catch (err) {
          feedback.className = 'form-feedback is-error';
          feedback.style.display = 'block';
          feedback.textContent = I18N.reportarErrorConexion;
        }
      });
    });
  </script>
  <script src="sesionNav.js"></script>
</body>
