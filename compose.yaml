name: recolix

x-web: &web
  restart: unless-stopped
  env_file: .env
  networks: [recolix_red]

services:
  gateway:
    restart: unless-stopped
    networks: [recolix_red]
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs:/etc/nginx/certs:ro,Z
    depends_on: [landing, backoffice, api-usuarios, api-gestion, api-recoleccion]

  landing:
    <<: *web
    build:
      context: .
      dockerfile: LandingPage/Dockerfile
    image: recolix/landing:${TAG:-1.0}
    volumes:
      - php_sessions:/var/www/sessions

  backoffice:
    <<: *web
    build:
      context: .
      dockerfile: Backoffice/Dockerfile
    image: recolix/backoffice:${TAG:-1.0}
    volumes:
      - php_sessions:/var/www/sessions

  api-usuarios:
    <<: *web
    build:
      context: .
      dockerfile: API_Usuarios/Dockerfile
    image: recolix/api-usuarios:${TAG:-1.0}
    volumes:
      - php_sessions:/var/www/sessions

  api-gestion:
    <<: *web
    build:
      context: .
      dockerfile: API_Gestion/Dockerfile
    image: recolix/api-gestion:${TAG:-1.0}
    volumes:
      - php_sessions:/var/www/sessions

  api-recoleccion:
    <<: *web
    build:
      context: .
      dockerfile: API_Recoleccion/Dockerfile
    image: recolix/api-recoleccion:${TAG:-1.0}
    volumes:
      - php_sessions:/var/www/sessions

networks:
  recolix_red:
    driver: bridge

volumes:
  php_sessions:
